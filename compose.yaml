secrets:
    PASSWORD: #登陆密码
        environment: PASSWORD
    BOT_TOKEN: #tg机器人token
        environment: BOT_TOKEN
    CHAT_ID: #tg我的chat_id
        environment: CHAT_ID
    API_KEY_BINANCE:
        environment: API_KEY_BINANCE
    SECRET_KEY_BINANCE:
        environment: SECRET_KEY_BINANCE
services:
    server:
        build:
            context: .
            dockerfile: ./server/Dockerfile
            # additional_contexts:
            #     - share=./share
        container_name: ta-server
        restart: unless-stopped
        volumes:
            - ./logs:/app/server/logs
        ports:
            - 8080:8080
        environment:
            - PORT=8080
            - WEB_PORT=443
            - DOMAIN="ta.rollingin.top"
        secrets:
            - PASSWORD
            - BOT_TOKEN
            - CHAT_ID
            - API_KEY_BINANCE
            - SECRET_KEY_BINANCE
        depends_on:
            - mongo
    web:
        build: 
            context: .
            dockerfile: ./web/Dockerfile
            # additional_contexts:
            #     - share=./share
            args:
                - NPM_REGISTRY
        container_name: ta-web
        restart: unless-stopped
        ports:
            - 80:80
            - 443:443
        volumes:
            - ./caddy:/etc/caddy
            - Caddy_data:/data
        # depends_on:
        #     - server
volumes:
    data_db:
    Caddy_data: