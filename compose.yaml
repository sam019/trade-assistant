secrets:
    PASSWORD: #登陆密码
        environment: PASSWORD
    BOT_TOKEN: #tg机器人token
        environment: BOT_TOKEN
    CHAT_ID: #tg我的chat_id
        environment: CHAT_ID
    API_KEY_BINANCE:
        environment: API_KEY_BINANCE
    SECRET_KEY_BINANCE:
        environment: SECRET_KEY_BINANCE
services:
    server:
        build:
            context: .
            dockerfile: ./server/Dockerfile
            # additional_contexts:
            #     - share=./share
        container_name: ta-server
        restart: unless-stopped
        volumes:
            - ./logs:/app/server/logs
            - data_db:/app/database
        ports:
            - 8080:8080
        environment:
            - PORT=8080
            - WEB_PORT=443
        secrets:
            - PASSWORD
            - BOT_TOKEN
            - CHAT_ID
            - API_KEY_BINANCE
            - SECRET_KEY_BINANCE
    web:
        image: ghcr.io/samleong019@gmail.com/trade-assistant-web:${IMAGE_TAG:-main}
        container_name: ta-web
        restart: unless-stopped
        ports:
            - 80:80
            - 443:443
        environment:
            - DOMAIN=rollingin.asia # 这里修改域名
        volumes:
            - ./caddy:/etc/caddy
            - Caddy_data:/data
volumes:
    data_db:
    Caddy_data: