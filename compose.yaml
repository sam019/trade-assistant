secrets:
    PASSWORD:
        environment: PASSWORD
    BOT_TOKEN:
        environment: BOT_TOKEN
    CHAT_ID:
        environment: CHAT_ID
    API_KEY_BINANCE:
        environment: API_KEY_BINANCE
    SECRET_KEY_BINANCE:
        environment: SECRET_KEY_BINANCE

services:
    server:
        build:
            context: .
            dockerfile: ./server/Dockerfile
        container_name: ta-server
        restart: unless-stopped
        volumes:
            - ./logs:/app/server/logs
            - data_db:/app/database
        ports:
            - 127.0.0.1:8080:8080
        environment:
            - PORT=8080
        secrets:
            - PASSWORD
            - BOT_TOKEN
            - CHAT_ID
            - API_KEY_BINANCE
            - SECRET_KEY_BINANCE

    web:
        image: ghcr.io/sam019/trade-assistant-web:${IMAGE_TAG:-main}
        container_name: ta-web
        restart: unless-stopped
        ports:
            - 127.0.0.1:8081:443 # 443端口用于给xray回落，xray回落必须是https网站
            - 80:80 # 80端口用来给let'S encrypt续期证书
        environment:
            - DOMAIN=${DOMAIN}
        volumes:
            - ./caddy:/etc/caddy
            - Caddy_data:/data

    xray:
        image: teddysun/xray:26.6.27 # 这个版本之后不能和homeproxy兼容
        container_name: ta-xray
        restart: unless-stopped
        network_mode: host
        user: root # 非root用户无法监听443端口
        entrypoint: ["/bin/sh", "/entrypoint.sh"]
        command: []
        volumes:
            - ./xray/entrypoint.sh:/entrypoint.sh:ro
            - ./xray/config.json.template:/config.json.template:ro
        environment:
            - DOMAIN=${DOMAIN}
            - PRIVATE_KEY=${PRIVATE_KEY}
            - SHORT_ID=${SHORT_ID}
            - UID=${UID}

volumes:
    data_db:
    Caddy_data: