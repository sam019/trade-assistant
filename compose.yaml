secrets:
    PASSWORD:
        environment: PASSWORD
    BOT_TOKEN:
        environment: BOT_TOKEN
    CHAT_ID:
        environment: CHAT_ID
    API_KEY_BINANCE:
        environment: API_KEY_BINANCE
    SECRET_KEY_BINANCE:
        environment: SECRET_KEY_BINANCE

services:
    server:
        build:
            context: .
            dockerfile: ./server/Dockerfile
        container_name: ta-server
        restart: unless-stopped
        volumes:
            - ./logs:/app/server/logs
            - data_db:/app/database
        ports:
            - 8080:8080
        environment:
            - PORT=8080
        secrets:
            - PASSWORD
            - BOT_TOKEN
            - CHAT_ID
            - API_KEY_BINANCE
            - SECRET_KEY_BINANCE

    web:
        image: ghcr.io/sam019/trade-assistant-web:${IMAGE_TAG:-main}
        container_name: ta-web
        restart: unless-stopped
        ports:
            - "127.0.0.1:8443:80"
        environment:
            - DOMAIN=${DOMAIN}
        volumes:
            - ./caddy:/etc/caddy
            - Caddy_data:/data

    xray:
        image: ghcr.io/xtls/xray-core:latest
        container_name: ta-xray
        restart: unless-stopped
        network_mode: host
        environment:
            - DOMAIN=${DOMAIN}
        volumes:
            - ./xray/config.json.template:/etc/xray/config.json.template:ro
            - ./xray/config.json:/usr/local/etc/xray/config.json
        # 使用容器内的环境变量生成 config 文件
        command: >
            sh -c "sed 's/\$DOMAIN/'\"$$DOMAIN\"'/g' /etc/xray/config.json.template > /usr/local/etc/xray/config.json && 
                exec xray run -config /usr/local/etc/xray/config.json"

volumes:
    data_db:
    Caddy_data: