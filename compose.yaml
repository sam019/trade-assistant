secrets:
    PASSWORD:
        environment: PASSWORD
    BOT_TOKEN:
        environment: BOT_TOKEN
    CHAT_ID:
        environment: CHAT_ID
    API_KEY_BINANCE:
        environment: API_KEY_BINANCE
    SECRET_KEY_BINANCE:
        environment: SECRET_KEY_BINANCE

services:
    server:
        build:
            context: .
            dockerfile: ./server/Dockerfile
        container_name: ta-server
        restart: unless-stopped
        volumes:
            - ./logs:/app/server/logs
            - data_db:/app/database
        ports:
            - 8080:8080
        environment:
            - PORT=8080
        secrets:
            - PASSWORD
            - BOT_TOKEN
            - CHAT_ID
            - API_KEY_BINANCE
            - SECRET_KEY_BINANCE

    web:
        image: ghcr.io/sam019/trade-assistant-web:${IMAGE_TAG:-main}
        container_name: ta-web
        restart: unless-stopped
        ports:
            - "127.0.0.1:8443:80"
        environment:
            - DOMAIN=${DOMAIN}
        volumes:
            - ./caddy:/etc/caddy
            - Caddy_data:/data

    xray:
        image: ghcr.io/xtls/xray-core:latest
        container_name: ta-xray
        restart: unless-stopped
        network_mode: host
        environment:
            - DOMAIN=${DOMAIN}
        volumes:
            - ./xray/config.json.template:/etc/xray/config.json.template:ro
            - ./xray/config.json:/usr/local/etc/xray/config.json
        # 使用 python3 读取模板并精准替换 $DOMAIN 变量
        command: >
            sh -c "python3 -c '
            import os
            domain = os.environ.get(\"DOMAIN\")
            with open(\"/etc/xray/config.json.template\", \"r\") as f:
                content = f.read()
            content = content.replace(\"\$DOMAIN\", domain)
            with open(\"/usr/local/etc/xray/config.json\", \"w\") as f:
                f.write(content)
            ' && exec xray run -config /usr/local/etc/xray/config.json"

volumes:
    data_db:
    Caddy_data: